name: pykrete check

# Runs `pykrete check` over every annotated .pyk file in this repo on
# every push + every PR + nightly. pykrete itself is built fresh from
# its main branch, so any regression in pykrete's checker shows up
# here before it gets released.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 06:30 UTC daily — early enough that the result is fresh by the
    # time the project owner starts the day on most timezones.
    - cron: "30 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Pin the upstream pykrete ref we build against. Defaults to main;
  # bump to a specific tag (e.g. v0.1.6) once we want this repo to
  # track stable releases instead of bleeding edge.
  PYKRETE_REF: main

jobs:
  check:
    name: pykrete check · annotated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      # Cache the pykrete build so the second-and-later runs are fast.
      # Keyed on PYKRETE_REF so a pin bump (or main moving) invalidates
      # cleanly. ~/.cargo holds the registry; the rest is the pykrete
      # source checkout we clone below.
      - name: Cache pykrete build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pykrete-src/target
          key: pykrete-${{ env.PYKRETE_REF }}-${{ runner.os }}

      - name: Build pykrete from ${{ env.PYKRETE_REF }}
        run: |
          git clone --depth=1 --branch "$PYKRETE_REF" \
            https://github.com/amirnaderi93/pykrete.git pykrete-src
          (cd pykrete-src && cargo build --release -p pykrete)
          # Resolve the actual commit we built against so the run log
          # makes the bisection target obvious.
          PYKRETE_SHA=$(git -C pykrete-src rev-parse --short HEAD)
          echo "PYKRETE_SHA=$PYKRETE_SHA" >> "$GITHUB_ENV"
          echo "pykrete built from $PYKRETE_REF @ $PYKRETE_SHA" >> "$GITHUB_STEP_SUMMARY"

      # Find every annotated .pyk and run `pykrete check` on it. No
      # early abort, so a regression on one file doesn't hide one on
      # another; the final exit code is the OR of all of them.
      - name: Run pykrete check on annotated files
        run: |
          set +e
          PYKRETE=./pykrete-src/target/release/pykrete
          fails=0
          total=0
          while IFS= read -r f; do
            total=$((total + 1))
            echo "::group::$f"
            $PYKRETE check "$f"
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              echo "  ❌ $f (exit $rc)" >> "$GITHUB_STEP_SUMMARY"
              fails=$((fails + 1))
            else
              echo "  ✅ $f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(find . -type d -name pykrete-src -prune -o \
            -path '*/annotated/*' -name '*.pyk' -type f -print | sort)
          if [ $total -eq 0 ]; then
            echo "::warning::no annotated/**/*.pyk files found"
            exit 0
          fi
          echo "Checked $total annotated file(s); $fails failed." >> "$GITHUB_STEP_SUMMARY"
          if [ $fails -ne 0 ]; then
            echo "::error::$fails annotated file(s) reported issues"
            exit 1
          fi
